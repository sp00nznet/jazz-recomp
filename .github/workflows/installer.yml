# The installer for this commit (recomp-launcher with launcher/launcher.json).
# An artifact on every push to main, a release file on a v* tag. The
# installer holds no game code: it fetches this repo and pcrecomp as
# source and builds from the player's own CD.
name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@v0.3.0
    with:
      launcher-ref: v0.3.0
      name: Jazz-Recomp-Installer
      platforms: windows
